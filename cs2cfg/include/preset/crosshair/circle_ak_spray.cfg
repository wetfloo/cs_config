crosshair true
cl_crosshairstyle 3

cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 132
cl_crosshaircolor_a 255
cl_crosshairalpha 255

cl_crosshair_drawoutline 0
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 0

cl_crosshair_length 10
cl_crosshair_gap 72
cl_crosshair_thickness 3

cl_crosshair_sniper_width 2

cl_crosshair_t false
cl_crosshair_recoil false
cl_crosshairdot true

// This parameter controls the actual crosshair size on some
// crosshair types, for some reason.
cl_crosshair_dynamic_maxdist_splitratio 0.10
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_spread_limit 255

alias "__internal_crosshair_recoil_on" "cl_crosshair_gap 10"
alias "__internal_crosshair_recoil_off" "cl_crosshair_gap 72"
