crosshair true
cl_crosshairstyle 9

cl_crosshaircolor_r 0
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshairalpha 255

cl_crosshair_drawoutline 1
cl_crosshairoutline_r 255
cl_crosshairoutline_g 255
cl_crosshairoutline_b 255
cl_crosshairoutline_a 255

cl_crosshair_length 10
cl_crosshair_gap 8
cl_crosshair_thickness 3

cl_crosshair_sniper_width 2

cl_crosshair_t false
cl_crosshair_recoil false
cl_crosshairdot true

// This parameter controls the actual crosshair size on some
// crosshair types, for some reason.
cl_crosshair_dynamic_maxdist_splitratio 0.10
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_spread_limit 160

// Hidden and undocumented?
// cl_crosshair_screen_height 900

alias "__internal_crosshair_recoil_off" "cl_crosshair_dynamic_maxdist_splitratio 0.2;"
alias "__internal_crosshair_recoil_on" "cl_crosshair_dynamic_maxdist_splitratio 0.5;"

alias "__internal_event_start_fire" "cl_crosshaircolor_r 255;cl_crosshaircolor_g 255;cl_crosshaircolor_b 255;cl_crosshaircolor_a 255; cl_crosshair_drawoutline 1; cl_crosshairoutline_r 0; cl_crosshairoutline_g 0; cl_crosshairoutline_b 0; cl_crosshairoutline_a 255;"
alias "__internal_event_end_fire" "cl_crosshaircolor_r 0;cl_crosshaircolor_g 0;cl_crosshaircolor_b 0;cl_crosshaircolor_a 255;cl_crosshair_drawoutline 1;cl_crosshairoutline_r 255;cl_crosshairoutline_g 255;cl_crosshairoutline_b 255;cl_crosshairoutline_a 255;"
